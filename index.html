
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Showcase Web Animasi RoughJS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0F0F0F; color: white; }
    </style>
</head>
<body class="p-8">
    <h1 class="text-3xl font-bold mb-6">Video Showcase Web Animasi RoughJS</h1>
    <section class="mb-8 bg-gray-800 p-6 rounded-lg">
        <h2 class="text-xl font-semibold mb-2">Informasi Proyek</h2>
        <p><strong>Use case:</strong> demo produk, cerita pendek, draw my life, tutorial, iklan, dll</p>
        <p><strong>Stack:</strong> groq whisper large v3, web chat ai, prompt (automate)</p>
        <p><strong>Teknik render:</strong> audio-driven</p>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="video-grid">
        <!-- Cards will be populated here -->
    </div>

    <dialog id="modal" class="bg-gray-900 text-white p-6 rounded-lg w-full max-w-2xl">
        <div id="modal-content" class="aspect-video mb-4"></div>
        <h2 id="modal-title" class="text-2xl font-bold mb-2"></h2>
        <p id="modal-desc" class="mb-4"></p>
        <button onclick="document.getElementById('modal').close()" class="bg-blue-500 px-4 py-2 rounded">Tutup</button>
    </dialog>

    <script>
        const videos = [
            { id: "c9YYyEOqYNA", title: "Abstract Shapes Animation", desc: "Animasi bentuk abstrak dinamis menggunakan RoughJS." },
            { id: "UCOHrUUwQB4", title: "Character Drawing Demo", desc: "Demonstrasi menggambar karakter dengan gaya sketsa." },
            { id: "7U7keycb8eI", title: "Logo Reveal Effect", desc: "Animasi reveal logo yang estetik dan unik." },
            { id: "8bkbi4UHeCc", title: "Data Visualization Chart", desc: "Grafik data yang divisualisasikan dengan gaya tangan." },
            { id: "_zumvJKsxhQ", title: "Interactive Storytelling", desc: "Pengalaman bercerita interaktif lewat animasi." },
            { id: "RRzwc2XFxmI", title: "Text Emphasis Animation", desc: "Animasi penekanan teks untuk konten edukasi." },
            { id: "PxwoPIAfOIw", title: "Product Feature Highlight", desc: "Sorotan fitur produk dengan animasi menarik." }
        ];

        const grid = document.getElementById('video-grid');
        videos.forEach(v => {
            const card = document.createElement('div');
            card.className = "bg-gray-800 p-2 rounded cursor-pointer hover:bg-gray-700 transition";
            // Use YouTube thumbnail
            card.innerHTML = `
                <img src="https://img.youtube.com/vi/${v.id}/0.jpg" alt="${v.title}" class="w-full h-48 object-cover rounded mb-2">
                <h3 class="font-bold px-2 pb-2">${v.title}</h3>
            `;
            card.onclick = () => {
                document.getElementById('modal-title').innerText = v.title;
                document.getElementById('modal-desc').innerText = v.desc;
                document.getElementById('modal-content').innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${v.id}" frameborder="0" allowfullscreen></iframe>`;
                document.getElementById('modal').showModal();
            };
            grid.appendChild(card);
        });
    </script>
</body>
</html>
